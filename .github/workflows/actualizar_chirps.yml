name: Actualizar CHIRPS (v3.0)

on:
  schedule:
    # Ejecutar el día 25 de cada mes a las 06:00 UTC (la tercera semana ya pasó, datos Final disponibles)
    - cron: '0 6 25 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar GDAL y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          pip install rasterio geopandas requests python-dateutil
      
      - name: Ejecutar script de CHIRPS
        run: python scripts/generar_chirps.py
      
      - name: Commit y Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tiles_chirps/ datos/chirps_metadata.json
          git commit -m "Actualización CHIRPS $(date +'%Y-%m')" || echo "Sin cambios"
          git push

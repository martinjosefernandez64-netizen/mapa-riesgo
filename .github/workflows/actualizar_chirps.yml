name: Actualizar CHIRPS (v3.0)

on:
  schedule:
    # Ejecutar el día 25 de cada mes a las 06:00 UTC (producto Final en la 3ª semana)
    - cron: '0 6 25 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar GDAL y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          pip install rasterio geopandas requests python-dateutil rioxarray xarray

      - name: Cachear GeoTIFFs crudos y recortes de CHIRPS
        uses: actions/cache@v4
        with:
          path: cache_chirps/
          key: chirps-cache-${{ github.run_id }}
          restore-keys: |
            chirps-cache-

      - name: Ejecutar script de CHIRPS
        run: python scripts/generar_chirps.py
        env:
          CHIRPS_CACHE_DIR: cache_chirps

      - name: Commit y Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tiles_chirps/ datos/chirps_metadata.json
          git commit -m "Actualización CHIRPS $(date +'%Y-%m')" || echo "Sin cambios"
          git push

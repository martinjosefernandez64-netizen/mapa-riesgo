name: Actualizar pronóstico 72h

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: pronostico-72h
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar GDAL (solo binarios)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Verificar instalación
        run: |
          python -c "import xarray, rioxarray, geopandas, s3fs; print('OK')"
          gdalinfo --version
          which gdal2tiles.py

      - name: Ejecutar script de pronóstico
        run: python scripts/generar_pronostico.py

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push
        run: |
          git add tiles_pronostico/ datos/pronostico/
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear"
            exit 0
          fi
          git commit -m "Actualización pronóstico 72h $(date -u +%Y

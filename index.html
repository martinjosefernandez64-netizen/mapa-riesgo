<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Riesgo - Santa Fe</title>
  <!-- Soluciona el error 404 del favicon -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h4>Capas</h4>

    <div class="capa-grupo">
      <div class="capa-titulo">Nivel de riesgo</div>
      <label>
        <input type="checkbox" id="chk-distritos" checked>
        Distritos (riesgo alto+crítico)
      </label>
    </div>

    <div class="capa-grupo">
      <div class="capa-titulo">Pronóstico de precipitación</div>
      <label>
        <input type="checkbox" id="chk-total"> Total 72 h
      </label>
      <label>
        <input type="checkbox" id="chk-dia1"> Día 1 (0–24 h)
      </label>
      <label>
        <input type="checkbox" id="chk-dia2"> Día 2 (24–48 h)
      </label>
      <label>
        <input type="checkbox" id="chk-dia3"> Día 3 (48–72 h)
      </label>
    </div>

    <div class="capa-grupo">
      <div class="capa-titulo">Red vial</div>
      <label>
        <input type="checkbox" id="chk-rutas"> Rutas provinciales
      </label>
    </div>

    <div id="aviso" class="aviso">
      <div class="aviso-titulo">Pronóstico en vigor</div>
      <div class="aviso-linea"><strong>Emitido:</strong> <span id="aviso-emitido">—</span></div>
      <div class="aviso-linea"><strong>Válido hasta:</strong> <span id="aviso-vigencia">—</span></div>
      <div class="aviso-linea" id="aviso-estado"></div>
    </div>

    <div id="aviso-vencido" class="aviso aviso-alerta" style="display:none;">
      <div class="aviso-titulo">Pronóstico no disponible</div>
      <div class="aviso-linea">La capa no se ha podido cargar.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="rutas.js"></script>
</body>
</html>

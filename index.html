<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Riesgo - Santa Fe</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100%; }
    #panel {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; padding: 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      max-width: 280px; font-size: 14px;
    }
    #panel h4 { margin: 0 0 8px 0; font-size: 15px; }
    #panel label { display: block; margin: 6px 0; cursor: pointer; }
    .aviso {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #eef6fc;
      border-left: 4px solid #2171b5;
      font-size: 12px;
      line-height: 1.4;
    }
    .aviso-alerta {
      background: #fdecea;
      border-left-color: #c0392b;
    }
    .aviso-titulo {
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .aviso-linea {
      margin: 2px 0;
    }
    .aviso-linea strong {
      color: #333;
    }
    .leyenda {
      background: white;
      padding: 10px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 12px;
      line-height: 1.5;
      max-width: 220px;
    }
    .leyenda-titulo {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .leyenda-item {
      display: flex;
      align-items: center;
      margin: 2px 0;
    }
    .leyenda-color {
      width: 18px;
      height: 14px;
      margin-right: 6px;
      border: 1px solid rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .leyenda-pie {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h4>Capas</h4>
  <label>
    <input type="checkbox" id="chk-pronostico"> Pronóstico 72 h
  </label>

  <div id="aviso-pronostico" class="aviso" style="display:none;">
    <div class="aviso-titulo">Pronóstico en vigor</div>
    <div class="aviso-linea">
      <strong>Emitido:</strong> <span id="aviso-emitido">—</span>
    </div>
    <div class="aviso-linea">
      <strong>Válido hasta:</strong> <span id="aviso-vigencia">—</span>
    </div>
    <div class="aviso-linea" id="aviso-estado"></div>
  </div>

  <div id="aviso-vencido" class="aviso aviso-alerta" style="display:none;">
    <div class="aviso-titulo">Pronóstico no disponible</div>
    <div class="aviso-linea">
      La capa de pronóstico no ha podido cargarse o no tiene datos recientes.
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // PNG de 1x1 transparente para reemplazar teselas faltantes.
  // Red de seguridad: con bounds ajustados al polígono no debería
  // haber 404, pero si algún día aparecen, se ven transparentes.
  const PNG_TRANSPARENTE =
    'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

  // ---------- Mapa base ----------
  const map = L.map('map').setView([-31.5, -60.5], 7);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // ---------- Leyenda ----------
  let controlLeyenda = null;

  function construirLeyenda(meta) {
    const leyenda = L.control({ position: 'bottomright' });
    leyenda.onAdd = function () {
      const div = L.DomUtil.create('div', 'leyenda');
      let html = '<div class="leyenda-titulo">Precipitación 72 h (mm)</div>';
      const items = meta.escala.slice().reverse();
      items.forEach(function (item) {
        html += '<div class="leyenda-item">' +
                '<span class="leyenda-color" style="background:' + item.color + ';"></span>' +
                '<span>' + item.label + '</span>' +
                '</div>';
      });
      html += '<div class="leyenda-pie">' +
              'Corrida: ' + meta.corrida_wrf + '<br>' +
              'Máx: ' + meta.max_mm.toFixed(1) + ' mm' +
              '</div>';
      div.innerHTML = html;
      return div;
    };
    return leyenda;
  }

  // ---------- Pronóstico 72 h ----------
  let capaPronostico = null;
  const HORAS_VIGENCIA = 30;

  fetch('datos/pronostico/metadata.json')
    .then(function (r) { return r.json(); })
    .then(function (meta) {
      if (!meta.fecha_emision) {
        document.getElementById('aviso-vencido').style.display = 'block';
        document.getElementById('chk-pronostico').disabled = true;
        return;
      }

      const emitido = new Date(meta.fecha_emision);
      const vigenteHasta = new Date(emitido.getTime() + 72 * 3600 * 1000);
      const ahora = new Date();
      const horasDesdeEmision = (ahora - emitido) / 3600 / 1000;

      const formatoAR = {
        timeZone: 'America/Argentina/Buenos_Aires',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      };

      const aviso = document.getElementById('aviso-pronostico');
      document.getElementById('aviso-emitido').textContent =
        emitido.toLocaleString('es-AR', formatoAR);
      document.getElementById('aviso-vigencia').textContent =
        vigenteHasta.toLocaleString('es-AR', formatoAR);

      const estado = document.getElementById('aviso-estado');
      if (horasDesdeEmision > HORAS_VIGENCIA) {
        estado.innerHTML =
          '<span style="color:#c0392b;">Última actualización hace ' +
          Math.round(horasDesdeEmision) +
          ' h. El pronóstico puede estar desactualizado.</span>';
      } else {
        estado.innerHTML =
          '<span style="color:#1a7f37;">Actualizado. Máximo previsto: ' +
          meta.max_mm.toFixed(1) + ' mm en 72 h.</span>';
      }

      // Capa de pronóstico con errorTileUrl de seguridad.
      capaPronostico = L.tileLayer(
        'tiles_pronostico/{z}/{x}/{y}.png',
        {
          opacity: 0.75,
          tms: false,
          minZoom: 0,
          maxNativeZoom: meta.zoom_max,
          maxZoom: 18,
          errorTileUrl: PNG_TRANSPARENTE,
          attribution: 'WRF-SMN · acumulado 72 h'
        }
      );

      controlLeyenda = construirLeyenda(meta);

      document.getElementById('chk-pronostico')
        .addEventListener('change', function (e) {
          if (e.target.checked) {
            capaPronostico.addTo(map);
            controlLeyenda.addTo(map);
            aviso.style.display = 'block';
          } else {
            map.removeLayer(capaPronostico);
            map.removeControl(controlLeyenda);
            aviso.style.display = 'none';
          }
        });
    })
    .catch(function (err) {
      console.warn('Pronóstico no disponible:', err);
      document.getElementById('aviso-vencido').style.display = 'block';
      document.getElementById('chk-pronostico').disabled = true;
    });
</script>
</body>
</html>
